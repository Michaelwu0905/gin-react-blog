server {
    listen 80;
    server_name 49.232.126.241;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://49.232.126.241$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name 49.232.126.241;
    ssl_certificate /etc/letsencrypt/live/ip-49.232.126.241/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ip-49.232.126.241/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    client_max_body_size 12m;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
