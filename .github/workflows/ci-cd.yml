name: Test, Publish and Deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
        working-directory: backend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run build
        working-directory: frontend
      - run: bash -n deploy/deploy.sh deploy/ssh-deploy.sh
      - name: Validate Dockerfiles on pull requests
        if: github.event_name == 'pull_request'
        run: |
          docker build --platform linux/amd64 -t blog-ci-backend backend
          docker build --platform linux/amd64 -t blog-ci-frontend frontend
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/michaelwu0905/gin-react-blog-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Michaelwu0905/gin-react-blog
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Publish frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/michaelwu0905/gin-react-blog-frontend:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/Michaelwu0905/gin-react-blog
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Mirror infrastructure images
        run: |
          set -Eeuo pipefail
          for pair in 'mysql:8.0 mysql:8.0' 'prom/prometheus:v3.15.0 prometheus:v3.15.0' 'grafana/grafana:13.2.3 grafana:13.2.3'; do
            read -r source target <<< "$pair"
            destination="ghcr.io/michaelwu0905/gin-react-blog-$target"
            if ! docker manifest inspect "$destination" >/dev/null 2>&1; then
              docker pull --platform linux/amd64 "$source"
              docker tag "$source" "$destination"
              docker push "$destination"
            fi
          done
  deploy:
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: blog-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy exact release
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/blog_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/blog_deploy' EXIT
          ssh_options=(-i ~/.ssh/blog_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          missing=$(ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "images $GITHUB_SHA")
          mkdir images
          if [[ -n "$missing" ]]; then
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            mapfile -t image_names <<< "$missing"
            for image in "${image_names[@]}"; do docker pull --platform linux/amd64 "$image"; done
            docker save "${image_names[@]}" > images/delivery.tar
          fi
          { printf '%s\n' "$GHCR_TOKEN"; tar -cf - deploy monitoring images | gzip -1; } |
            ssh "${ssh_options[@]}" \
              "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"
