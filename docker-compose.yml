services:
  # 1. 数据库服务
  db:
    image: mysql:8.0
    container_name: blog-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456  # 生产环境请勿使用简单密码
      MYSQL_DATABASE: blog_db
    volumes:
      - db_data:/var/lib/mysql       # 数据持久化，防止重启丢失数据
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - blog-network

  # 2. 后端服务 (Gin)
  backend:
    build: ./backend                 # 指向后端 Dockerfile 所在目录
    container_name: blog-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy   # 等待数据库就绪后连接
    environment:
      # 这里的 host 必须填数据库的服务名 'db'，不能填 localhost
      DB_HOST: db                    
      DB_USER: root
      DB_PASSWORD: 123456
      DB_NAME: blog_db
      DB_PORT: 3306
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      - blog-network
    # 注意：后端端口不需要映射到宿主机，只需要暴露给内部网络即可
    # 如果你想在本地调试后端，可以取消下面注释
    # ports:
    #   - "8080:8080"

  # 3. 前端服务 (React + Nginx)
  frontend:
    build: ./frontend                # 指向前端 Dockerfile 所在目录
    container_name: blog-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"                      # 将容器的 80 端口映射到电脑的 80 端口
    networks:
      - blog-network

  # 4. 指标采集与存储
  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
    networks:
      - blog-network

  # 5. 监控面板（本机匿名只读，管理员密码由 .env 提供）
  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?请在 .env 中设置 GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - blog-network

# 定义网络，让容器之间可以通过服务名互访
networks:
  blog-network:
    driver: bridge

# 定义数据卷
volumes:
  db_data:
  prometheus_data:
  grafana_data:
